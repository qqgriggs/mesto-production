<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesto</title>
    <link rel="stylesheet" href="./assets/index-D2z4Cjqv.css">
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img src="./assets/logo-C_QQpFK1.svg" alt="Логотип" class="logo header__logo" />
      </header>

      <main class="content">
        <section class="profile page__section">
          <div class="profile__image"></div>
          <div class="profile__info">
            <h1 class="profile__title"></h1>
            <button class="profile__edit-button" type="button"></button>
            <p class="profile__description"></p>
          </div>
          <button class="profile__add-button" type="button"></button>
        </section>

        <section class="places page__section">
          <ul class="places__list"></ul>
        </section>
      </main>

      <footer class="footer page__section">
        <p class="footer__copyright">© 2025 Mesto Russia</p>
      </footer>

      <!-- Попап редактирования профиля -->
      <div class="popup popup_type_edit">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Редактировать профиль</h3>
          <form class="popup__form" name="edit-profile">
            <label class="popup__label">
              <input type="text" name="user-name" id="user-name" class="popup__input popup__input_type_name" placeholder="Имя" />
            </label>
            <label class="popup__label">
              <input type="text" name="user-description" id="user-description" class="popup__input popup__input_type_description" placeholder="Занятие" />
            </label>
            <button type="submit" class="button popup__button">Сохранить</button>
          </form>
        </div>
      </div>

      <!-- Попап добавления карточки -->
      <div class="popup popup_type_new-card">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Новое место</h3>
          <form class="popup__form" name="new-place">
            <label class="popup__label">
              <input type="text" name="place-name" id="place-name" class="popup__input popup__input_type_card-name" placeholder="Название" />
            </label>
            <label class="popup__label">
              <input type="url" name="place-link" id="place-link" class="popup__input popup__input_type_url" placeholder="Ссылка на картинку" />
            </label>
            <button type="submit" class="button popup__button">Создать</button>
          </form>
        </div>
      </div>

      <!-- Попап просмотра изображения -->
      <div class="popup popup_type_image">
        <div class="popup__content popup__content_content_image">
          <button type="button" class="popup__close"></button>
          <img src="" alt="" class="popup__image" />
          <p class="popup__caption"></p>
        </div>
      </div>

      <!-- Попап обновления аватара -->
      <div class="popup popup_type_edit-avatar">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Обновить аватар</h3>
          <form class="popup__form" name="edit-avatar">
            <label class="popup__label">
              <input type="url" name="user-avatar" id="user-avatar" class="popup__input popup__input_type_avatar" placeholder="Ссылка на изображение" />
            </label>
            <button type="submit" class="button popup__button">Сохранить</button>
          </form>
        </div>
      </div>
    </div>

    <script src="./assets/index-dbJsqvtx.js" type="module"></script>

    <!-- Шаблон карточки -->
    <template id="card-template">
      <li class="places__item card">
        <img class="card__image" src="" alt="" />
        <div class="card__control">
          <button type="button" class="card__control-button card__control-button_type_delete"></button>
        </div>
        <div class="card__description">
          <h2 class="card__title"></h2>
          <div class="card__likes">
            <button type="button" class="card__like-button"></button>
            <span class="card__like-count"></span>
          </div>
        </div>
      </li>
    </template>

    <!-- Стили и статистика -->
    <style>
      .popup_type_info {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .popup_type_info.popup_is-opened {
        display: flex;
      }
      .popup_type_info .popup__content {
        background: white;
        padding: 20px;
        border-radius: 10px;
        max-width: 400px;
        width: 90%;
        position: relative;
      }
      .popup__info-item {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 1px solid #eee;
      }
      .popup__info-term {
        font-weight: bold;
      }
      .stats-close {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 24px;
        cursor: pointer;
        background: none;
        border: none;
      }
      .logo {
        cursor: pointer;
      }
    </style>

    <div class="popup popup_type_info">
      <div class="popup__content">
        <button class="stats-close">×</button>
        <h3>Статистика пользователей</h3>
        <div id="stats-list"></div>
      </div>
    </div>

    <script>
      (function() {
        const popup = document.querySelector('.popup_type_info');
        const closeBtn = popup.querySelector('.stats-close');
        const statsDiv = document.getElementById('stats-list');
        
        closeBtn.onclick = () => popup.classList.remove('popup_is-opened');
        popup.onclick = (e) => { if (e.target === popup) popup.classList.remove('popup_is-opened'); };
        
        const formatDate = (d) => d.toLocaleDateString('ru-RU', { year: 'numeric', month: 'long', day: 'numeric' });
        
        const cardWord = (n) => {
          if (n % 10 === 1 && n % 100 !== 11) return 'карточка';
          if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'карточки';
          return 'карточек';
        };
        
        const logo = document.querySelector('.logo');
        if (logo) {
          logo.onclick = () => {
            statsDiv.innerHTML = '<div style="text-align:center">Загрузка...</div>';
            popup.classList.add('popup_is-opened');
            
            fetch('https://mesto.nomoreparties.co/v1/apf-cohort-203/cards', {
              headers: { authorization: '372f2f36-3b26-4143-83bf-18a1756e2c84' }
            })
              .then(r => r.json())
              .then(cards => {
                if (!cards.length) { statsDiv.innerHTML = '<div>Нет карточек</div>'; return; }
                const sorted = [...cards].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                const users = {};
                cards.forEach(c => users[c.owner.name] = (users[c.owner.name] || 0) + 1);
                const maxCards = Math.max(...Object.values(users));
                const topUser = Object.entries(users).find(([_,c]) => c === maxCards)[0];
                
                statsDiv.innerHTML = `
                  <div class="popup__info-item"><span class="popup__info-term">Всего карточек:</span><span>${cards.length}</span></div>
                  <div class="popup__info-item"><span class="popup__info-term">Первая создана:</span><span>${formatDate(new Date(sorted[sorted.length-1].createdAt))}</span></div>
                  <div class="popup__info-item"><span class="popup__info-term">Последняя создана:</span><span>${formatDate(new Date(sorted[0].createdAt))}</span></div>
                  <div class="popup__info-item"><span class="popup__info-term">Всего пользователей:</span><span>${Object.keys(users).length}</span></div>
                  <div class="popup__info-item"><span class="popup__info-term">Максимум карточек:</span><span>${maxCards} (${topUser})</span></div>
                  <hr>
                  <div><strong>Все пользователи:</strong></div>
                  ${Object.entries(users).sort((a,b) => b[1]-a[1]).map(([n,c]) => `<div class="popup__info-item"><span>${n}</span><span>${c} ${cardWord(c)}</span></div>`).join('')}
                `;
              })
              .catch(() => statsDiv.innerHTML = '<div style="color:red">Ошибка загрузки</div>');
          };
        }
      })();
    </script>
  </body>
</html>
